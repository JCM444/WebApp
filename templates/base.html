<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Study Circle{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;600;700&family=Barlow:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    {{ bootstrap.load_css() }}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar bg-primary px-5">
        <div class="container">
            <div class="d-flex align-items-center gap-2 navbar-brand">
                <img src="{{ url_for('static', filename='assets/icon.svg') }}" width="40" height="40" alt="">
                <a class="text-decoration-none text-white fs-2 fw-semibold" href="{{ url_for('index') }}">Study Circle</a>
            </div>
            {% if session.get("authenticated") %}
                <div class="navbar-nav flex-row align-items-center gap-4">
                    <a class="nav-link" href="{{ url_for('index') }}">Entdecken</a>
                    <a class="nav-link" href="{{ url_for('index') }}">Organisieren</a>
                    <a class="nav-link" href="{{ url_for('index') }}">Meine Sessions</a>

                    <a class="text-decoration-none" href="{{ url_for ('index') }}">
                        <span class="rounded-circle fw-semibold d-flex justify-content-center align-items-center text-primary bg-white" style="width: 40px; height: 40px">
                            <i class="bi bi-person-fill"></i>
                        </span>
                    </a>
                </div>
            {% elif request.endpoint == 'identity.login' %}
                <a class="btn btn-outline-light py-2" href="{{ url_for('index') }}">Startseite</a>
            {% else %}
                <a class="btn btn-outline-light py-2" href="{{ url_for('identity.login') }}">Anmelden</a>
            {% endif %}
        </div>
    </nav>
    <main class="container-fluid">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
